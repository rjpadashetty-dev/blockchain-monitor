name: Blockchain Monitor CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/bcmonitor-backend
  FRONTEND_IMAGE: ${{ github.repository }}/bcmonitor-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm test -- --passWithNoTests
      - run: cd backend && npm audit --audit-level=high || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report frontend UI metrics
        if: always()
        env:
          CICD_METRICS_URL: ${{ secrets.CICD_METRICS_URL }}
          CICD_METRICS_TOKEN: ${{ secrets.CICD_METRICS_TOKEN }}
        run: |
          if [ -z "$CICD_METRICS_URL" ] || [ -z "$CICD_METRICS_TOKEN" ]; then
            echo "CI/CD metrics secrets are not configured; skipping report"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            PIPELINE_STATUS="passed"
          else
            PIPELINE_STATUS="failed"
          fi

          curl --fail-with-body -X POST "${CICD_METRICS_URL%/}/api/admin/pipeline-status" \
            -H "Content-Type: application/json" \
            -H "X-CICD-Token: $CICD_METRICS_TOKEN" \
            -d "{\"workflow\":\"Frontend UI\",\"status\":\"$PIPELINE_STATUS\",\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"buildNumber\":${{ github.run_number }},\"author\":\"${{ github.actor }}\"}" \
            || echo "Warning: frontend UI metrics report failed"

      - name: Report Docker image build metrics
        if: always()
        env:
          CICD_METRICS_URL: ${{ secrets.CICD_METRICS_URL }}
          CICD_METRICS_TOKEN: ${{ secrets.CICD_METRICS_TOKEN }}
        run: |
          if [ -z "$CICD_METRICS_URL" ] || [ -z "$CICD_METRICS_TOKEN" ]; then
            echo "CI/CD metrics secrets are not configured; skipping report"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            PIPELINE_STATUS="passed"
          else
            PIPELINE_STATUS="failed"
          fi

          curl --fail-with-body -X POST "${CICD_METRICS_URL%/}/api/admin/pipeline-status" \
            -H "Content-Type: application/json" \
            -H "X-CICD-Token: $CICD_METRICS_TOKEN" \
            -d "{\"workflow\":\"Docker Images\",\"status\":\"$PIPELINE_STATUS\",\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"buildNumber\":${{ github.run_number }},\"author\":\"${{ github.actor }}\"}" \
            || echo "Warning: Docker image metrics report failed"

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
      
      - name: Run Trivy vulnerability scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
      
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
      
      - name: Upload Trivy frontend results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'

  deploy-production:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull and run production images
        run: |
          # Pull images
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          
          # Stop any running containers
          docker stop bcmonitor-backend bcmonitor-frontend || true
          docker rm bcmonitor-backend bcmonitor-frontend || true
          
          # Create network
          docker network create bcmonitor-net || true
          
          # Create directories for volumes
          mkdir -p /tmp/blockchain-monitor/db
          mkdir -p /tmp/blockchain-monitor/prometheus
          
          # Initialize db.json with proper format
          cat > /tmp/blockchain-monitor/db/db.json << 'EOF'
          {
            "users": [],
            "transactions": [],
            "alerts": [],
            "systemLogs": []
          }
          EOF
          
          # Set proper permissions
          chmod 666 /tmp/blockchain-monitor/db/db.json
          
          # Run backend with detailed output
          echo "🚀 Starting backend container..."
          docker run -d \
            --name bcmonitor-backend \
            --network bcmonitor-net \
            -p 5000:5000 \
            -e PORT=5000 \
            -e NODE_ENV=production \
            -e JWT_SECRET=blockchain-monitor-secret-change-in-production \
            -e FRONTEND_URL=http://localhost:3000 \
            -v /tmp/blockchain-monitor/db:/app \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          
          echo "⏳ Waiting 30 seconds for backend to initialize..."
          sleep 30
          
          echo "📋 Backend startup logs:"
          docker logs bcmonitor-backend || echo "No logs yet"
          
          # Run frontend
          echo "🚀 Starting frontend container..."
          docker run -d \
            --name bcmonitor-frontend \
            --network bcmonitor-net \
            -p 3000:3000 \
            -e BACKEND_URL=http://bcmonitor-backend:5000/api \
            -e PORT=3000 \
            -e NODE_ENV=production \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          
          sleep 10
      
      - name: Health check
        run: |
          echo "═══════════════════════════════════════"
          echo "🏥 BACKEND HEALTH CHECK"
          echo "═══════════════════════════════════════"
          
          docker ps -a
          echo ""
          echo "📊 Container status check:"
          docker inspect bcmonitor-backend --format='{{json .State}}' || true
          
          echo ""
          echo "📋 Full backend logs:"
          docker logs bcmonitor-backend 2>&1 || echo "No logs available"
          
          echo ""
          echo "🌐 Attempting to connect to backend..."
          for i in {1..40}; do
            echo "Attempt $i/40: Testing http://localhost:5000/api/health"
            if curl -v http://localhost:5000/api/health 2>&1 | head -20; then
              echo "✅ SUCCESS: Backend is healthy!"
              exit 0
            fi
            echo "⏳ Waiting 3 seconds..."
            sleep 3
          done
          
          echo ""
          echo "═══════════════════════════════════════"
          echo "❌ HEALTH CHECK FAILED"
          echo "═══════════════════════════════════════"
          echo ""
          echo "📊 Final container status:"
          docker ps -a
          echo ""
          echo "📋 Final backend logs (last 200 lines):"
          docker logs bcmonitor-backend --tail=200 2>&1
          echo ""
          echo "🔍 Network inspection:"
          docker network inspect bcmonitor-net 2>&1 || true
          echo ""
          echo "🔍 Backend container details:"
          docker inspect bcmonitor-backend 2>&1 || true
          
          exit 1
      
      - name: Report pipeline metrics
        if: always()
        run: |
          # Determine overall pipeline status
          if [ "${{ job.status }}" == "success" ]; then
            PIPELINE_STATUS="passed"
          else
            PIPELINE_STATUS="failed"
          fi
          
          echo "📊 Reporting pipeline metrics..."
          echo "Status: $PIPELINE_STATUS"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Build Number: ${{ github.run_number }}"
          
          # Report to the deployed backend without failing the deployment if metrics are unavailable.
          if [ -z "${{ secrets.CICD_METRICS_URL }}" ] || [ -z "${{ secrets.CICD_METRICS_TOKEN }}" ]; then
            echo "CI/CD metrics secrets are not configured; skipping report"
            exit 0
          fi

          curl --fail-with-body -X POST "${{ secrets.CICD_METRICS_URL }}/api/admin/pipeline-status" \
            -H "Content-Type: application/json" \
            -H "X-CICD-Token: ${{ secrets.CICD_METRICS_TOKEN }}" \
            -d '{
              "workflow": "Production Deployment",
              "status": "'$PIPELINE_STATUS'",
              "commit": "'${{ github.sha }}'",
              "branch": "'${{ github.ref_name }}'",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "buildNumber": '${{ github.run_number }}',
              "author": "'${{ github.actor }}'"
            }' -v || echo "Warning: production deployment metrics report failed"
