version: '3.9'

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    # Use GHCR image if provided via BUILD_IMAGE, else build locally
    image: ${BACKEND_IMAGE:-bcmonitor-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bcmonitor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-blockchain-monitor-secret-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ../backend/db.json:/app/db.json   # Persist database
    networks:
      - bcmonitor-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Node.js Server) ────────────────────────────────────────────────
  frontend:
    # Use GHCR image if provided via FRONTEND_IMAGE, else build locally
    image: ${FRONTEND_IMAGE:-bcmonitor-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bcmonitor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000/api}
      - PORT=${FRONTEND_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - bcmonitor-net
    depends_on:
      backend:
        condition: service_healthy

  # ── Prometheus (Monitoring) ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bcmonitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - bcmonitor-net

  # ── Grafana (Dashboards) ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bcmonitor-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - bcmonitor-net
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  bcmonitor-net:
    driver: bridge
