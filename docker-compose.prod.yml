version: '3.9'

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}:${BACKEND_TAG:-latest}
    container_name: bcmonitor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-blockchain-monitor-secret-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL}
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_MODE=${BLOCKCHAIN_MODE:-readonly}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
    networks:
      - bcmonitor-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Node.js Server) ────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE}:${FRONTEND_TAG:-latest}
    container_name: bcmonitor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000/api}
      - PORT=3000
      - NODE_ENV=production
    networks:
      - bcmonitor-net
    depends_on:
      backend:
        condition: service_healthy

  # ── Prometheus Monitoring ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bcmonitor-net

networks:
  bcmonitor-net:
    driver: bridge

volumes:
  prometheus-data:
